<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVCE - STEPX Phase 0 Attendance Form - 10:15 AM</title>
  <style>
    :root {
      --fluent-bg: #f3f2f1;
      --fluent-card: #ffffff;
      --fluent-primary: #0078d4;
      --fluent-text: #201f1e;
      --fluent-subtext: #605e5c;
      --fluent-border: #edebe9;
      --fluent-focus: #005a9e;
      --fluent-error: #a80000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--fluent-bg);
      color: var(--fluent-text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-header-card {
      background: var(--fluent-card);
      border-radius: 4px;
      padding: 28px 32px;
      border-top: 6px solid var(--fluent-primary);
      box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132), 0 .3px .9px 0 rgba(0,0,0,.108);
    }

    .form-title {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--fluent-subtext);
    }

    .question-card {
      background: var(--fluent-card);
      border-radius: 4px;
      padding: 24px 32px;
      box-shadow: 0 1.6px 3.6px 0 rgba(0,0,0,.132), 0 .3px .9px 0 rgba(0,0,0,.108);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .question-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .required-star {
      color: var(--fluent-error);
      margin-left: 2px;
    }

    .text-input {
      width: 100%;
      border: 1px solid #8a8886;
      border-radius: 2px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.1s ease;
    }

    .text-input:focus {
      border-color: var(--fluent-primary);
      box-shadow: 0 0 0 1px var(--fluent-primary);
    }

    .choice-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .choice-item input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--fluent-primary);
      cursor: pointer;
    }

    .action-row {
      display: flex;
      justify-content: flex-start;
      margin-top: 8px;
    }

    .submit-button {
      background-color: var(--fluent-primary);
      color: #ffffff;
      border: none;
      padding: 8px 24px;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-button:hover {
      background-color: var(--fluent-focus);
    }

    .test-controls {
      background: #e1dfdd;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <div class="test-controls">
      <span>🛠️ <strong>Test Sandbox:</strong> This page mimics real Microsoft Forms DOM and classes for STEPX.</span>
      <button type="button" id="btn-insert-dynamic" style="padding: 4px 10px; cursor: pointer; border-radius: 2px; border: 1px solid #999;">+ Add Late Dynamic Question</button>
    </div>

    <!-- Header Card -->
    <div class="form-header-card">
      <h1 class="form-title" data-automation-id="formTitle">SVCE - STEPX Phase 0 Attendance Form - 10:15 AM</h1>
      <p class="form-subtitle">Please mark your attendance for the current STEPX session.</p>
    </div>

    <form id="office-form-root" novalidate>
      <!-- Question 1: Name -->
      <div class="question-card office-form-question" data-automation-id="questionItem">
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>1. Name</span>
          <span class="required-star">*</span>
        </div>
        <div class="office-form-question-element">
          <input type="text" id="q1" class="text-input" data-automation-id="textInput" placeholder="Enter your answer">
        </div>
      </div>

      <!-- Question 2: College Email ID -->
      <div class="question-card office-form-question" data-automation-id="questionItem">
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>2. College Email ID</span>
          <span class="required-star">*</span>
        </div>
        <div class="office-form-question-element">
          <input type="email" id="q2" class="text-input" data-automation-id="textInput" placeholder="Enter your answer">
        </div>
      </div>

      <!-- Question 3: USN Number -->
      <div class="question-card office-form-question" data-automation-id="questionItem">
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>3. USN Number</span>
          <span class="required-star">*</span>
        </div>
        <div class="office-form-question-element">
          <input type="text" id="q3" class="text-input" data-automation-id="textInput" placeholder="Enter your answer">
        </div>
      </div>

      <!-- Question 4: Mobile number -->
      <div class="question-card office-form-question" data-automation-id="questionItem">
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>4. Mobile number</span>
          <span class="required-star">*</span>
        </div>
        <div class="office-form-question-element">
          <input type="tel" id="q4" class="text-input" data-automation-id="textInput" placeholder="Enter your answer">
        </div>
      </div>

      <!-- Question 5: Attendance -->
      <div class="question-card office-form-question" data-automation-id="questionItem" id="attendance-card">
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>5. Are you attending the session ?</span>
          <span class="required-star">*</span>
        </div>
        <div class="choice-group" role="radiogroup" aria-label="5. Are you attending the session ? *">
          <label class="choice-item" data-automation-id="choiceItem">
            <input type="radio" name="attendance_group" value="Yes">
            <span>Yes</span>
          </label>
          <label class="choice-item" data-automation-id="choiceItem">
            <input type="radio" name="attendance_group" value="No">
            <span>No</span>
          </label>
        </div>
      </div>

      <div id="dynamic-container"></div>

      <!-- Submit Section -->
      <div class="action-row">
        <button type="submit" class="submit-button" id="submit-btn">Submit</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("btn-insert-dynamic").addEventListener("click", () => {
      const container = document.getElementById("dynamic-container");
      const div = document.createElement("div");
      div.className = "question-card office-form-question";
      div.setAttribute("data-automation-id", "questionItem");
      div.innerHTML = `
        <div class="question-title office-form-question-title" data-automation-id="questionTitle">
          <span>6. Alternate Contact / Phone No</span>
        </div>
        <div class="office-form-question-element">
          <input type="tel" class="text-input" data-automation-id="textInput" placeholder="Enter your answer">
        </div>
      `;
      container.appendChild(div);
    });

    document.getElementById("office-form-root").addEventListener("submit", (e) => {
      e.preventDefault();
      alert("Form submitted manually by user!");
    });
  </script>
</body>
</html>
